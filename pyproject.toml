[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mic"
version = "0.1.0"
description = "Backing-track and MIDI workflows for open-mic performances"
requires-python = ">=3.10"

[project.scripts]
open-mic = "open_mic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
